name: Test High-Res Telegram Telethon

on:
  workflow_dispatch:

jobs:
  test_telethon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install telethon
      - name: Run test_telethon_bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python test_telethon_bot.py
