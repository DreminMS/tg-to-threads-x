name: Realtime Telegram Crossposter (Threads & Twitter)

on:
  schedule:
    # Runs every 10 minutes to check for new posts in @dremin_live
    - cron: '*/10 * * * *'
  # Allows manual run from GitHub Actions or trigger via webhook
  workflow_dispatch:
  repository_dispatch:
    types: [new_telegram_post]

concurrency:
  group: git-repo-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crosspost:
    runs-on: ubuntu-latest
    env:
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
      TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Check and Publish New Telegram Posts
        run: |
          python crosspost.py --once

      - name: Sync Audience Comments
        run: |
          python comments_manager.py --sync

      - name: Commit and push state
        run: |
          python update_status.py
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add crosspost.db status.json docs/status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-crosspost and archive progress [skip ci]" && git push origin main)
