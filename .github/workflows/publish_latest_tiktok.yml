name: Publish Latest Post to TikTok

on:
  workflow_dispatch:

concurrency:
  group: git-repo-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish_tiktok:
    runs-on: ubuntu-latest
    env:
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      TIKTOK_COOKIES_JSON: ${{ secrets.TIKTOK_COOKIES_JSON }}
      TIKTOK_SESSION_ID: ${{ secrets.TIKTOK_SESSION_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Publish latest post to TikTok
        run: |
          python publish_latest_to_tiktok.py

      - name: Commit and push state
        run: |
          python update_status.py
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add crosspost.db status.json docs/status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Publish latest post to TikTok [skip ci]" && git pull --rebase origin main && git push origin main)
