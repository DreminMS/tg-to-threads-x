name: Hourly Archive Poster (Threads & Twitter)

on:
  schedule:
    # Runs hourly between 07:00 MSK (04:00 UTC) and 00:00 MSK (21:00 UTC)
    - cron: '0 4-21 * * *'
  # Allows manual triggering directly from the GitHub Actions tab or mobile PWA
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform: publish or skip'
        required: false
        default: 'publish'
      post_id:
        description: 'Post ID to skip (when action=skip)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  manage_archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Handle Skip Post
        if: ${{ inputs.action == 'skip' && inputs.post_id != '' }}
        run: |
          python archive_poster.py --skip ${{ inputs.post_id }}
          python update_status.py

      - name: Install dependencies (Publishing)
        if: ${{ !inputs.action || inputs.action != 'skip' }}
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Check and Publish New Telegram Posts
        if: ${{ !inputs.action || inputs.action != 'skip' }}
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python crosspost.py --once

      - name: Publish Next Archive Post
        if: ${{ !inputs.action || inputs.action != 'skip' }}
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python archive_poster.py --publish-one

      - name: Commit and push queue state
        run: |
          python update_status.py
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add crosspost.db status.json docs/status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-post archive progress and status [skip ci]" && git pull --rebase origin main && git push origin main)
