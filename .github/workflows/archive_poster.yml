name: Hourly Archive Poster (Threads & Twitter)

on:
  schedule:
    # Runs every hour at the top of the hour
    - cron: '0 * * * *'
  # Allows manual triggering directly from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish_next:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Publish Next Archive Post
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python archive_poster.py --publish-one

      - name: Commit and push queue state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add crosspost.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-post archive progress [skip ci]" && git push)
